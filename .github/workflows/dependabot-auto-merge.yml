name: Dependabot Auto-Merge

on:
  pull_request_target

permissions:
  pull-requests: write
  contents: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: ${{ github.actor == 'dependabot[bot]' }}
    steps:
      - name: 获取 Dependabot 元数据
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      # 条件判断「非 major」而非「是 patch / minor」：dependabot.yml 已开启分组，
      # 分组 PR 的 update-type 可能为空，旧条件（== semver-patch || == semver-minor）
      # 永不成立 → step 被 skipped → PR 无人合并。
      # major 已在 dependabot.yml 里 ignore，不会出现在分组 PR 中，故「非 major」即可合并。
      - name: 等 CI 通过后自动合并（跳过 major）
        if: ${{ steps.metadata.outputs.update-type != 'version-update:semver-major' }}
        run: |
          # 审批失败不阻断合并（自有仓库通常无需审批）
          gh pr review --approve "$PR_URL" || true
          # ⚠️ 必须等 CI（Build CI / build）跑完且通过再合并：
          # 以前这里是 `gh pr merge --auto --squash || gh pr merge --squash`，
          # 主分支没配必需状态检查时 --auto 会被 GitHub 拒绝（"Pull request is in clean status"），
          # 于是回退成**直接合并** —— 依赖升级会在 typecheck/build 失败的状态下被合进 main
          # （terser 行为变化会破坏跨 chunk 属性协议，Vue 升级会改变 chunk 切分）。
          # 现在改为显式等待检查结果：失败则不合并。
          # 先等检查出现（PR 刚创建时可能还没上报）
          for i in $(seq 1 30); do
            if gh pr checks "$PR_URL" >/dev/null 2>&1; then break; fi
            echo "等待 CI 启动... ($i/30)"
            sleep 10
          done
          gh pr checks "$PR_URL" --watch --fail-fast || {
            echo "CI 未通过，不合并"
            exit 1
          }
          gh pr merge --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
